name: Build and Deploy — Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rabotka-admin

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Deploy pre-built image from GHCR to VPS.
  # Reuses the latest image built by the develop workflow.
  # VITE_BACKEND_URL and PORT are injected at runtime via .env.
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS (production)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Fetch secrets from Vault
        id: vault
        run: |
          LOGIN_RESPONSE=$(curl -s --request POST \
            --data "{\"role_id\":\"${{ secrets.VAULT_ROLE_ID_PROD }}\",\"secret_id\":\"${{ secrets.VAULT_SECRET_ID_PROD }}\"}" \
            "${{ secrets.VAULT_ADDR }}/v1/auth/approle/login")
          TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.auth.client_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Vault AppRole login failed. Response keys: $(echo "$LOGIN_RESPONSE" | jq -r 'keys | join(", ")')"
            echo "::error::Vault errors: $(echo "$LOGIN_RESPONSE" | jq -r '.errors // [] | join(", ")')"
            exit 1
          fi
          echo "Vault login OK, token acquired"

          SECRET_RESPONSE=$(curl -s \
            --header "X-Vault-Token: $TOKEN" \
            "${{ secrets.VAULT_ADDR }}/v1/secret/data/apps/rabotka-admin-production")

          SECRET_KEYS=$(echo "$SECRET_RESPONSE" | jq -r '.data.data | keys | join(", ")' 2>/dev/null || echo "none")
          echo "Secret keys found: $SECRET_KEYS"

          VAULT_SECRET=$(echo "$SECRET_RESPONSE" | jq -r '.data.data')

          VITE_BACKEND_URL=$(echo "$VAULT_SECRET" | jq -r '.VITE_BACKEND_URL')
          if [ -z "$VITE_BACKEND_URL" ] || [ "$VITE_BACKEND_URL" = "null" ]; then
            echo "::error::VITE_BACKEND_URL not found in Vault secret. Available keys: $SECRET_KEYS"
            exit 1
          fi
          echo "vite_backend_url=$VITE_BACKEND_URL" >> $GITHUB_OUTPUT

          VITE_PORT=$(echo "$VAULT_SECRET" | jq -r '.PORT')
          if [ -z "$VITE_PORT" ] || [ "$VITE_PORT" = "null" ]; then
            echo "::error::PORT not found in Vault secret. Available keys: $SECRET_KEYS"
            exit 1
          fi
          echo "vite_port=$VITE_PORT" >> $GITHUB_OUTPUT

          curl -sf --request POST \
            --header "X-Vault-Token: $TOKEN" \
            "${{ secrets.VAULT_ADDR }}/v1/auth/token/revoke-self" > /dev/null || true

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # Runner→GHCR is reliable; this login is only used by the SSH-stream
      # fallback below (runner pulls the image, then streams it to the VPS).
      - name: Log in to GHCR (for fallback)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image on VPS (native, SSH-stream fallback)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/rabotka-admin:latest"
          DEST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          SSHOPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -p ${{ secrets.VPS_PORT }}"
          # Fast path: native pull on the VPS. Short 90s timeout × 3 so a
          # VPS→GHCR blackhole fails fast (~5 min) instead of hanging ~30 min.
          if ssh $SSHOPTS "$DEST" "ok=0; for i in 1 2 3; do timeout 90 docker pull '$IMAGE' && { ok=1; break; }; echo \"native pull attempt \$i stalled...\"; sleep 5; done; [ \$ok = 1 ]"; then
            echo "✅ Native pull succeeded"
          else
            # Fallback: the VPS can't pull from GHCR, but the runner can. Pull
            # here, then stream the image to the VPS over the (IPv4) SSH channel,
            # which is unaffected by the registry blackhole.
            echo "⚠️ Native pull stalled — streaming image to VPS over SSH"
            docker pull "$IMAGE"
            docker save "$IMAGE" | gzip -1 | ssh $SSHOPTS "$DEST" "gunzip | docker load"
            echo "✅ Image loaded on VPS via SSH stream"
          fi

      - name: Write .env and deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cat > ~/rabotka-admin-prod/.env << 'EOF'
          ADMIN_IMAGE=ghcr.io/${{ github.repository_owner }}/rabotka-admin:latest
          APP_ENV=prod
          ADMIN_DOMAIN=${{ secrets.PROD_ADMIN_DOMAIN }}
          VITE_BACKEND_URL=${{ steps.vault.outputs.vite_backend_url }}
          VITE_PORT=${{ steps.vault.outputs.vite_port }}
          EOF
          sed -i 's/^[[:space:]]*//' ~/rabotka-admin-prod/.env
          cd ~/rabotka-admin-prod && git fetch origin main && git reset --hard origin/main && \
          docker compose -f docker-compose.prod.yml up -d --remove-orphans && \
          docker image prune -af"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Smoke test
  # ───────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test (production)
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Wait for container to stabilize
        run: sleep 30

      - name: Check admin is reachable
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 20 \
              "https://${{ secrets.PROD_ADMIN_DOMAIN }}")
            echo "Attempt $i — HTTP status: $STATUS"
            [[ "$STATUS" = "200" || "$STATUS" = "302" ]] && exit 0
            sleep 15
          done
          echo "Admin did not return 200 or 302 after 3 attempts"
          exit 1

      - name: Slack notify success
        if: success()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#00B32C",
                  "text": "Deployment Succeeded (admin production)\n${{ github.event.pull_request.title }}\nBranch: ${{ github.ref_name }}\nAuthor: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }

      - name: Slack notify failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#B3000C",
                  "text": "Deployment Failed (admin production)\n${{ github.event.pull_request.title }}\nBranch: ${{ github.ref_name }}\nAuthor: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }
