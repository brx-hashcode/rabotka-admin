name: Build and Deploy — Develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rabotka-admin

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Build Docker image and push to GHCR.
  # VITE_BACKEND_URL is injected at runtime via .env — the proxy in
  # vite preview reads it from process.env, not from the compiled bundle.
  # A single image can therefore serve both environments.
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build and Push Image
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy pre-built image to VPS
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS (develop)
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Fetch secrets from Vault
        id: vault
        run: |
          LOGIN_RESPONSE=$(curl -s --request POST \
            --data "{\"role_id\":\"${{ secrets.VAULT_ROLE_ID }}\",\"secret_id\":\"${{ secrets.VAULT_SECRET_ID }}\"}" \
            "${{ secrets.VAULT_ADDR }}/v1/auth/approle/login")
          TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.auth.client_token')

          SECRET_RESPONSE=$(curl -s \
            --header "X-Vault-Token: $TOKEN" \
            "${{ secrets.VAULT_ADDR }}/v1/secret/data/apps/rabotka-admin-develop")
          VAULT_SECRET=$(echo "$SECRET_RESPONSE" | jq -r '.data.data')
          echo "vite_backend_url=$(echo "$VAULT_SECRET" | jq -r '.VITE_BACKEND_URL')" >> $GITHUB_OUTPUT
          echo "port=$(echo "$VAULT_SECRET" | jq -r '.PORT')" >> $GITHUB_OUTPUT

          curl -sf --request POST \
            --header "X-Vault-Token: $TOKEN" \
            "${{ secrets.VAULT_ADDR }}/v1/auth/token/revoke-self" > /dev/null || true

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull image on VPS
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/rabotka-admin:latest"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker pull $IMAGE"

      - name: Write .env and deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cat > ~/rabotka-admin/.env << 'EOF'
          ADMIN_IMAGE=ghcr.io/${{ github.repository_owner }}/rabotka-admin:latest
          APP_ENV=develop
          ADMIN_DOMAIN=admin-rabotka.${{ secrets.INFRA_DOMAIN }}
          VITE_BACKEND_URL=${{ steps.vault.outputs.vite_backend_url }}
          VITE_PORT=${{ steps.vault.outputs.port }}
          EOF
          sed -i 's/^[[:space:]]*//' ~/rabotka-admin/.env
          cd ~/rabotka-admin && git fetch origin develop && git reset --hard origin/develop && \
          docker compose -f docker-compose.prod.yml up -d --remove-orphans"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Smoke test
  # ───────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test (develop)
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Wait for container to stabilize
        run: sleep 30

      - name: Check admin is reachable
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 20 \
              "https://admin-rabotka.${{ secrets.INFRA_DOMAIN }}")
            echo "Attempt $i — HTTP status: $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 15
          done
          echo "Admin did not return 200 after 3 attempts"
          exit 1

      - name: Slack notify success
        if: success()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#00B32C",
                  "text": "Deployment Succeeded (admin develop)\n${{ github.event.pull_request.title }}\nBranch: ${{ github.ref_name }}\nAuthor: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }

      - name: Slack notify failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#B3000C",
                  "text": "Deployment Failed (admin develop)\n${{ github.event.pull_request.title }}\nBranch: ${{ github.ref_name }}\nAuthor: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              ]
            }
