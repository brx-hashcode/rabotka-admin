name: Build and Deploy — Develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rabotka-admin

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

# One deploy at a time. Three PRs merged seconds apart raced each other on the
# VPS: concurrent `git fetch` in the same checkout failed with "cannot lock ref
# 'refs/remotes/origin/develop'" and two of the three deploys died.
#
# Queue rather than cancel — killing a run mid `docker compose up` can leave the
# VPS on a half-swapped container. GitHub keeps only the newest pending run, so
# a burst of merges converges on the latest commit instead of replaying each.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Build Docker image and push to GHCR.
  # VITE_BACKEND_URL is injected at runtime via .env — the proxy in
  # vite preview reads it from process.env, not from the compiled bundle.
  # A single image can therefore serve both environments.
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build and Push Image
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Pin a recent BuildKit so type=gha cache uses the current GitHub
          # Actions Cache backend (the legacy v1/v2 backend was retired in 2025).
          # Without this, an older BuildKit calls the deprecated reserve API and
          # fails on cache export with "failed to reserve cache".
          driver-opts: image=moby/buildkit:v0.19.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=buildkit-develop
          # ignore-error=true keeps cache export best-effort: a GitHub Actions
          # Cache service outage logs a warning instead of failing the build
          # (the image is already built and pushed before this step).
          cache-to: type=gha,mode=max,scope=buildkit-develop,ignore-error=true

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy pre-built image to VPS
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS (develop)
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Fetch secrets from Vault
        id: vault
        run: |
          LOGIN_RESPONSE=$(curl -s --request POST \
            --data "{\"role_id\":\"${{ secrets.VAULT_ROLE_ID }}\",\"secret_id\":\"${{ secrets.VAULT_SECRET_ID }}\"}" \
            "${{ secrets.VAULT_ADDR }}/v1/auth/approle/login")
          TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.auth.client_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Vault AppRole login failed. Response keys: $(echo "$LOGIN_RESPONSE" | jq -r 'keys | join(", ")')"
            echo "::error::Vault errors: $(echo "$LOGIN_RESPONSE" | jq -r '.errors // [] | join(", ")')"
            exit 1
          fi
          echo "Vault login OK, token acquired"

          SECRET_RESPONSE=$(curl -s \
            --header "X-Vault-Token: $TOKEN" \
            "${{ secrets.VAULT_ADDR }}/v1/secret/data/apps/rabotka-admin-develop")

          SECRET_KEYS=$(echo "$SECRET_RESPONSE" | jq -r '.data.data | keys | join(", ")' 2>/dev/null || echo "none")
          echo "Secret keys found: $SECRET_KEYS"

          VAULT_SECRET=$(echo "$SECRET_RESPONSE" | jq -r '.data.data')

          VITE_BACKEND_URL=$(echo "$VAULT_SECRET" | jq -r '.VITE_BACKEND_URL')
          if [ -z "$VITE_BACKEND_URL" ] || [ "$VITE_BACKEND_URL" = "null" ]; then
            echo "::error::VITE_BACKEND_URL not found in Vault secret. Available keys: $SECRET_KEYS"
            exit 1
          fi
          echo "vite_backend_url=$VITE_BACKEND_URL" >> $GITHUB_OUTPUT

          VITE_PORT=$(echo "$VAULT_SECRET" | jq -r '.PORT')
          if [ -z "$VITE_PORT" ] || [ "$VITE_PORT" = "null" ]; then
            echo "::error::PORT not found in Vault secret. Available keys: $SECRET_KEYS"
            exit 1
          fi
          echo "vite_port=$VITE_PORT" >> $GITHUB_OUTPUT

          curl -sf --request POST \
            --header "X-Vault-Token: $TOKEN" \
            "${{ secrets.VAULT_ADDR }}/v1/auth/token/revoke-self" > /dev/null || true

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull image on VPS
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/rabotka-admin:latest"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "ok=0; for i in 1 2 3 4 5 6; do docker pull $IMAGE && { ok=1; break; }; echo \"Pull attempt \$i failed, retrying in \$((i*10))s...\"; sleep \$((i*10)); done; [ \$ok = 1 ] || { echo 'All pull attempts failed'; exit 1; }"

      - name: Write .env and deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cat > ~/rabotka-admin/.env << 'EOF'
          ADMIN_IMAGE=ghcr.io/${{ github.repository_owner }}/rabotka-admin:latest
          APP_ENV=develop
          ADMIN_DOMAIN=admin-rabotka.${{ secrets.INFRA_DOMAIN }}
          VITE_BACKEND_URL=${{ steps.vault.outputs.vite_backend_url }}
          VITE_PORT=${{ steps.vault.outputs.vite_port }}
          EOF
          sed -i 's/^[[:space:]]*//' ~/rabotka-admin/.env
          cd ~/rabotka-admin && git fetch origin develop && git reset --hard origin/develop && \
          docker compose -f docker-compose.prod.yml up -d --remove-orphans"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Smoke test
  # ───────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test (develop)
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Check admin is reachable
        run: |
          # Short initial wait, then poll tightly so a healthy container is
          # detected in ~10-16s while still tolerating a slow start:
          # 10s + 24×6s ≈ 2.5 min ceiling. Exits on first 200/302.
          sleep 10
          for i in $(seq 1 24); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 20 \
              "https://admin-rabotka.${{ secrets.INFRA_DOMAIN }}")
            echo "Attempt $i — HTTP status: $STATUS"
            [[ "$STATUS" = "200" || "$STATUS" = "302" ]] && exit 0
            sleep 6
          done
          echo "Admin did not return 200 or 302 after 24 attempts"
          exit 1

      - name: Slack notify success
        if: success()
        env:
          MESSAGE: |
            Deployment Succeeded (admin develop)
            ${{ github.event.pull_request.title }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#00B32C",
                  "text": ${{ toJSON(env.MESSAGE) }}
                }
              ]
            }

      - name: Slack notify failure
        if: failure()
        env:
          MESSAGE: |
            Deployment Failed (admin develop)
            ${{ github.event.pull_request.title }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#B3000C",
                  "text": ${{ toJSON(env.MESSAGE) }}
                }
              ]
            }
