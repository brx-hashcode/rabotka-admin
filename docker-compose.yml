services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    container_name: rabotka_admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_PORT: ${VITE_PORT:-3300}
    ports:
      - "${VITE_PORT:-3300}:${VITE_PORT:-3300}"
    networks:
      - rabotka_network

networks:
  rabotka_network:
    external: true
