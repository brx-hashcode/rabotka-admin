services:
  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/brx-hashcode/rabotka-admin:latest}
    container_name: rabotka_admin_${APP_ENV:-prod}
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hashcode-public"
      - "traefik.http.routers.rabotka-admin-${APP_ENV:-prod}.rule=Host(`${ADMIN_DOMAIN}`)"
      - "traefik.http.routers.rabotka-admin-${APP_ENV:-prod}.entrypoints=websecure"
      - "traefik.http.routers.rabotka-admin-${APP_ENV:-prod}.tls.certresolver=letsencrypt"
      - "traefik.http.services.rabotka-admin-${APP_ENV:-prod}.loadbalancer.server.port=${VITE_PORT:-3300}"

networks:
  public:
    name: hashcode-public
    external: true
