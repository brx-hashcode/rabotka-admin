  <style>
    #app-loading {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 9999;
      font-family: 'Manrope', 'Inter', sans-serif;
    }
    #app-loading .logo-img {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      object-fit: contain;
    }
    #app-loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid hsla(142, 70%, 49%, 0.25);
      border-top-color: hsl(142, 70%, 49%);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #app-loading .hint {
      font-size: 0.85rem;
      color: #71717a;
    }
    @media (prefers-color-scheme: dark) {
      #app-loading {
        background: #09090b;
      }
      #app-loading .hint {
        color: #a1a1aa;
      }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  </head>
  <body>
    <div id="app-loading">
      <img class="logo-img" src="/rabotka-logo.png" alt="Rabotka" />
      <div class="spinner"></div>
      <div class="hint">Chargement du tableau de bord…</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
