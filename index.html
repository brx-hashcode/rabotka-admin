<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Keep the browser from machine-translating this page.

      The UI is English and the team browsing it is French-speaking, so Chrome
      offers a translation on every visit. Accepting it swaps React-managed text
      nodes for Google's own <font> wrappers; the next render then tries to
      remove a node that is no longer where React left it, and the whole route
      dies with "NotFoundError: Failed to execute 'removeChild' on 'Node'".

      `translate="no"` on <html> is the standard signal; the meta is the older
      Google-specific form, kept because not every Chrome build honours the
      attribute alone. The durable fix is to ship the admin in French so there
      is nothing to translate -- this only removes the crash.
    -->
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <title>Rabotka - Dashboard</title>
    <meta
      name="description"
      content="Rabotka connecte les travailleurs informels et les employeurs grâce à un assistant WhatsApp simple. Trouvez du travail ou de l'aide directement sur WhatsApp, sans application à télécharger."
    />
    <meta name="author" content="Rabotka" />
    <meta
      name="keywords"
      content="emploi, travail informel, WhatsApp, Congo, Brazzaville, Afrique, aide ménagère, coiffeur, mécanicien, répétiteur"
    />

    <meta
      property="og:title"
      content="Rabotka - Trouvez du travail et de l'aide sur WhatsApp"
    />
    <meta
      property="og:description"
      content="Rabotka connecte les travailleurs informels et les employeurs grâce à un assistant WhatsApp simple. Sans application, sans complexité."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://rabotka.africa/opengraph-image-p98pqg.png"
    />
    <meta property="og:locale" content="fr_FR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Rabotka" />
    <meta
      name="twitter:image"
      content="https://rabotka.africa/opengraph-image-p98pqg.png"
    />
    <meta
      name="twitter:title"
      content="Rabotka - Trouvez du travail et de l'aide sur WhatsApp"
    />
    <meta
      name="twitter:description"
      content="Connectez-vous aux opportunités d'emploi via WhatsApp. Simple, gratuit et accessible."
    />
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 9999;
        font-family: "Manrope", "Inter", sans-serif;
      }
      #app-loading .logo-img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        object-fit: contain;
      }
      #app-loading .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid hsla(142, 70%, 49%, 0.25);
        border-top-color: hsl(142, 70%, 49%);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #app-loading .hint {
        font-size: 0.85rem;
        color: #71717a;
      }
      @media (prefers-color-scheme: dark) {
        #app-loading {
          background: #09090b;
        }
        #app-loading .hint {
          color: #a1a1aa;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loading">
      <img class="logo-img" src="/rabotka-logo.png" alt="Rabotka" />
      <div class="spinner"></div>
      <div class="hint">Chargement du tableau de bord…</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
